<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha An's Clin Chem Flashcards</title>
    
    <!-- 🌐 Google Fonts Import (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- 🧮 MathJax for rendering LaTeX formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --primary-color: #007bff;
            --border-color: #e0e0e0;
            --dynamic-card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #378fe9;
            --border-color: #333333;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            position: relative;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        .deck-selector-container {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 20px;
        }
        select {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            flex: 1;
            cursor: pointer;
            outline: none;
        }
        .stats {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.8;
            letter-spacing: -0.01em;
            text-align: left;
        }
        /* 3D Card Setup */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 320px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 15px;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 15px;
            background: var(--dynamic-card-bg);
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: -0.02em;
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease;
            overflow-y: auto;
        }
        html[data-theme="light"] .card-face {
            color: #1e293b; 
        }
        .card-back {
            transform: rotateY(180deg);
            border: 2px solid var(--primary-color);
        }
        /* Controls Menu */
        .controls, .score-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            letter-spacing: -0.01em;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            flex: 1;
        }
        button:hover { opacity: 0.9; }
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        button.success { background-color: #10b981; }
        button.danger { background-color: #ef4444; }
        #progress {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 60px;
            opacity: 0.7;
        }
        /* Modal Overlay for Transitions */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .overlay h2 {
            margin-top: 0;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
        }
        .overlay p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- End-of-Deck Loop Prompt Modal -->
    <div class="overlay" id="review-overlay">
        <h2 id="overlay-title">Deck Completed! 🎉</h2>
        <p id="overlay-desc">You've reached the end of this study session.</p>
        <button id="overlay-btn" onclick="handleOverlayAction()">Start Review Loop</button>
    </div>

    <div class="header-actions">
        <div class="stats">
            <span id="mode-badge" style="font-weight:600; color:var(--primary-color);">Main Round</span><br>
            Mastered: <span id="score">0</span> | Missed: <span id="review-count">0</span>
        </div>
        <button class="secondary" style="max-width: 120px;" onclick="toggleTheme()">Theme 🌓</button>
    </div>

    <!-- 🗂️ Dynamic Topic Menu Selector -->
    <div class="deck-selector-container">
        <select id="topic-select" onchange="selectTopic()"></select>
    </div>

    <div class="flashcard-container" onclick="handleCardClick()">
        <div class="flashcard" id="card">
            <div class="card-face card-front" id="front-text">Fetching data...</div>
            <div class="card-face card-back" id="back-text">Fetching data...</div>
        </div>
    </div>

    <div class="score-actions">
        <button class="danger" onclick="markCard(false, event)">Need Review ❌</button>
        <button class="success" onclick="markCard(true, event)">Mastered ✅</button>
    </div>

    <div class="controls">
        <button class="secondary" onclick="prevCard(event)">Previous</button>
        <span id="progress">0 / 0</span>
        <button class="secondary" onclick="nextCard(event)">Next</button>
        <button id="shuffle-btn" class="secondary" onclick="toggleShuffle(event)">Shuffle: OFF 🔀</button>
    </div>
</div>

<script>
    let masterData = {};
    let activeDeck = [];
    let originalDeck = [];
    let reviewPile = [];
    let currentIndex = 0;
    let masteredCount = 0;
    let isReviewMode = false;
    let isShuffled = false;
    let currentTheme = 'light';

    const lightPastels = ['#FFEBEE', '#E8F5E9', '#E3F2FD', '#FFF3E0', '#F3E5F5', '#FFFDE7'];
    const darkPastels = ['#2D1F21', '#1B281E', '#1A2332', '#2C2214', '#24192B', '#2B2B1A'];

    const cardEl = document.getElementById('card');
    const frontEl = document.getElementById('front-text');
    const backEl = document.getElementById('back-text');
    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');
    const reviewCountEl = document.getElementById('review-count');
    const modeBadgeEl = document.getElementById('mode-badge');
    const overlayEl = document.getElementById('review-overlay');
    const overlayTitleEl = document.getElementById('overlay-title');
    const overlayDescEl = document.getElementById('overlay-desc');
    const overlayBtnEl = document.getElementById('overlay-btn');
    const topicSelectEl = document.getElementById('topic-select');
    const shuffleBtnEl = document.getElementById('shuffle-btn');

    async function loadDeck() {
        try {
            // Append timestamp query parameter to bypass browser caching
            const response = await fetch('./cards.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            masterData = await response.json();
            populateTopicDropdown();
            selectTopic();
        } catch (error) {
            frontEl.textContent = "Error loading cards.json. Check file placement and network request access.";
            console.error(error);
        }
    }

    function populateTopicDropdown() {
        topicSelectEl.innerHTML = '';
        
        const allOption = document.createElement('option');
        allOption.value = 'all_mixed';
        allOption.textContent = 'All Topics (Mixed)';
        topicSelectEl.appendChild(allOption);

        for (const topic in masterData) {
            const option = document.createElement('option');
            option.value = topic;
            option.textContent = topic;
            topicSelectEl.appendChild(option);
        }
    }

    function selectTopic() {
        const selected = topicSelectEl.value;
        if (selected === 'all_mixed') {
            originalDeck = Object.values(masterData).flat();
        } else {
            originalDeck = [...(masterData[selected] || [])];
        }
        
        isShuffled = false;
        updateShuffleButton();
        resetState();
    }

    function resetState() {
        currentIndex = 0;
        masteredCount = 0;
        reviewPile = [];
        isReviewMode = false;
        modeBadgeEl.textContent = 'Main Round';
        overlayEl.style.display = 'none';

        if (isShuffled) {
            activeDeck = shuffleArray([...originalDeck]);
        } else {
            activeDeck = [...originalDeck];
        }

        updateStats();
        renderCard();
    }

    function renderCard() {
        cardEl.classList.remove('flipped');
        if (activeDeck.length === 0) {
            frontEl.innerHTML = "No cards available.";
            backEl.innerHTML = "";
            progressEl.textContent = "0 / 0";
            return;
        }

        const currentCard = activeDeck[currentIndex];
        
        // Convert \n newline characters to <br> HTML breaks
        frontEl.innerHTML = currentCard.front.replace(/\n/g, '<br>');
        backEl.innerHTML = currentCard.back.replace(/\n/g, '<br>');

        progressEl.textContent = `${currentIndex + 1} / ${activeDeck.length}`;
        applyCardColor();

        // Render LaTeX equations using MathJax if loaded
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([frontEl, backEl]);
        }
    }

    function applyCardColor() {
        const colors = currentTheme === 'light' ? lightPastels : darkPastels;
        const color = colors[currentIndex % colors.length];
        document.documentElement.style.setProperty('--dynamic-card-bg', color);
    }

    // Card Interaction:
    // Front side -> flips to back
    // Back side -> flips to front and advances to next card
    function handleCardClick() {
        if (cardEl.classList.contains('flipped')) {
            nextCard();
        } else {
            cardEl.classList.add('flipped');
        }
    }

    function prevCard(e) {
        if (e) e.stopPropagation();
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    function nextCard(e) {
        if (e) e.stopPropagation();
        if (currentIndex < activeDeck.length - 1) {
            currentIndex++;
            renderCard();
        } else {
            showCompletionOverlay();
        }
    }

    function markCard(isMastered, e) {
        if (e) e.stopPropagation();
        if (activeDeck.length === 0) return;

        const card = activeDeck[currentIndex];
        if (isMastered) {
            masteredCount++;
        } else if (!reviewPile.includes(card)) {
            reviewPile.push(card);
        }

        updateStats();
        nextCard();
    }

    function updateStats() {
        scoreEl.textContent = masteredCount;
        reviewCountEl.textContent = reviewPile.length;
    }

    function toggleShuffle(e) {
        if (e) e.stopPropagation();
        isShuffled = !isShuffled;
        updateShuffleButton();

        if (activeDeck.length === 0) return;

        const currentCard = activeDeck[currentIndex];

        if (isShuffled) {
            activeDeck = shuffleArray([...activeDeck]);
        } else {
            activeDeck = isReviewMode ? [...reviewPile] : [...originalDeck];
        }

        const newIndex = activeDeck.indexOf(currentCard);
        currentIndex = newIndex !== -1 ? newIndex : 0;

        renderCard();
    }

    function updateShuffleButton() {
        if (isShuffled) {
            shuffleBtnEl.textContent = 'Shuffle: ON 🔀';
            shuffleBtnEl.classList.remove('secondary');
        } else {
            shuffleBtnEl.textContent = 'Shuffle: OFF 🔀';
            shuffleBtnEl.classList.add('secondary');
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showCompletionOverlay() {
        overlayEl.style.display = 'flex';
        if (reviewPile.length > 0) {
            overlayTitleEl.textContent = 'Deck Completed! 🎉';
            overlayDescEl.textContent = `You have ${reviewPile.length} card(s) marked for review.`;
            overlayBtnEl.textContent = 'Start Review Loop';
        } else {
            overlayTitleEl.textContent = 'Perfect Score! 🌟';
            overlayDescEl.textContent = 'You mastered all cards in this topic.';
            overlayBtnEl.textContent = 'Restart Session';
        }
    }

    function handleOverlayAction() {
        overlayEl.style.display = 'none';
        if (reviewPile.length > 0) {
            activeDeck = [...reviewPile];
            reviewPile = [];
            isReviewMode = true;
            modeBadgeEl.textContent = 'Review Round';
        } else {
            selectTopic();
            return;
        }
        currentIndex = 0;
        updateStats();
        renderCard();
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        applyCardColor();
    }

    loadDeck();
</script>
</body>
</html>

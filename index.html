<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Flashcards</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --border-color: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #378fe9;
            --border-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .stats {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        /* 3D Card Setup */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 15px;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 15px;
            background: var(--card-bg);
            font-size: 1.4rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
        }
        /* Utility Control Menus */
        .controls, .score-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 1;
        }
        button:hover { opacity: 0.9; }
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        button.success { background-color: #28a745; }
        button.danger { background-color: #dc3545; }
        #progress {
            font-size: 0.9rem;
            min-width: 60px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <div class="stats">Mastered: <span id="score">0</span></div>
        <button class="secondary" style="max-width: 120px;" onclick="toggleTheme()">Theme 🌓</button>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="card-face card-front" id="front-text">Fetching data...</div>
            <div class="card-face card-back" id="back-text">Fetching data...</div>
        </div>
    </div>

    <div class="score-actions">
        <button class="danger" onclick="markCard(false, event)">Need Review ❌</button>
        <button class="success" onclick="markCard(true, event)">Mastered  ✅</button>
    </div>

    <div class="controls">
        <button class="secondary" onclick="prevCard(event)">Previous</button>
        <span id="progress">0 / 0</span>
        <button class="secondary" onclick="nextCard(event)">Next</button>
        <button onclick="shuffleDeck(event)">Shuffle 🔀</button>
    </div>
</div>

<script>
    let masterDeck = [];
    let activeDeck = [];
    let currentIndex = 0;
    let masteredCount = 0;

    const cardEl = document.getElementById('card');
    const frontEl = document.getElementById('front-text');
    const backEl = document.getElementById('back-text');
    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');

    // 🌐 Fetch runtime JSON data asynchronously 
    async function loadDeck() {
        try {
            const response = await fetch('./cards.json');
            masterDeck = await response.json();
            activeDeck = [...masterDeck];
            updateCard();
        } catch (error) {
            frontEl.textContent = "Error loading cards.json. Check file placement.";
            console.error(error);
        }
    }

    function updateCard() {
        if (activeDeck.length === 0) return;
        cardEl.classList.remove('flipped');
        
        setTimeout(() => {
            frontEl.textContent = activeDeck[currentIndex].front;
            backEl.textContent = activeDeck[currentIndex].back;
            progressEl.textContent = `${currentIndex + 1} / ${activeDeck.length}`;
        }, 150);
    }

    function flipCard() {
        cardEl.classList.toggle('flipped');
    }

    function nextCard(e) {
        if(e) e.stopPropagation();
        if (currentIndex < activeDeck.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard(e) {
        if(e) e.stopPropagation();
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    // 🔀 Fisher-Yates shuffle engine
    function shuffleDeck(e) {
        e.stopPropagation();
        for (let i = activeDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
        }
        currentIndex = 0;
        updateCard();
    }

    // 📊 Score Tracker logic
    function markCard(isMastered, e) {
        e.stopPropagation();
        if(isMastered) {
            masteredCount++;
            scoreEl.textContent = masteredCount;
        }
        nextCard();
    }

    // 🌓 Theme toggle tracking via localStorage
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    // Initialize application state
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    loadDeck();
</script>

</body>
</html>
